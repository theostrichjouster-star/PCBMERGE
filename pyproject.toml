[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbmerge"
version = "0.6.0"
description = "Combine multiple PCB designs into one schematic and board. Reads EAGLE and KiCad, writes EAGLE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pcbmerge = "pcbmerge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbmerge = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
