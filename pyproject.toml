[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbmerge"
version = "1.1.0"
description = "Combine multiple PCB designs into one schematic and board. Reads EAGLE and KiCad, writes EAGLE."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OstrichJouster" }]
keywords = ["pcb", "eagle", "kicad", "schematic", "eda", "hardware"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Environment :: Console",
    "Environment :: Web Environment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/theostrichjouster-star/PCBMERGE"
Issues = "https://github.com/theostrichjouster-star/PCBMERGE/issues"

[project.scripts]
pcbmerge = "pcbmerge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbmerge = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
